name: PR CI Commands

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: ci-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/rerun-ci') ||
       startsWith(github.event.comment.body, '/rerun-failed-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const handleCommand = require('./.github/scripts/ci-commands.cjs');
            await handleCommand({ github, context, core });
