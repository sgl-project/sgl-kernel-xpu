name: Lint

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Match the interpreter the Docker image / CI containers build and
          # test with (Dockerfile.xpu_kernel ARG PYTHON_VERSION=3.12) so lint
          # never disagrees with the environment the code actually runs in.
          python-version: "3.12"

      - name: Install pre-commit hook
        run: |
          python -m pip install pre-commit
          pre-commit install

      - name: Linting
        run: pre-commit run --all-files --show-diff-on-failure
