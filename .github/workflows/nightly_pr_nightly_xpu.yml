name: Nightly Test (XPU Kernel)

# Runs against the nightly Docker image published by
# release-docker-xpu-kernel-nightly.yml. The image already contains an
# installed sgl-kernel wheel, so this workflow does NOT rebuild the
# kernel from source — it exercises exactly what was shipped.
#
# Mirrors the structure of sglang/.github/workflows/nightly-test-intel.yml:
#   - Cron + workflow_dispatch + workflow_call triggers
#   - One GPU-count job per matrix entry (placeholder: 1-gpu only)
#   - check-all-jobs aggregator so a single failure fails the workflow

on:
  schedule:
    # A few hours after the nightly image publish (12:00 UTC).
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to checkout"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: true

concurrency:
  group: nightly-xpu-kernel-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || inputs.ref && format('caller-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !inputs.ref && github.event_name != 'workflow_call' && github.event_name != 'workflow_dispatch' }}

jobs:
  nightly-xpu-1-gpu:
    if: github.repository == 'sgl-project/sgl-kernel-xpu'
    runs-on: sglang-bmg
    env:
      DOCKERHUB_INTEL_USERNAME: ${{ secrets.DOCKERHUB_INTEL_USERNAME }}
      DOCKERHUB_INTEL_TOKEN: ${{ secrets.DOCKERHUB_INTEL_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Pull nightly Docker image
        run: |
          docker pull intel/sgl-kernel-xpu-dev:latest

      - name: Run container
        run: |
          docker run -dt \
            --device /dev/dri/ \
            --name nightly_sglkernel_xpu \
            -e HF_TOKEN=$(cat ~/huggingface_token.txt) \
            intel/sgl-kernel-xpu-dev:latest

      - name: Sync tests/ from checkout into container
        # The nightly image bakes tests/ at build time, so any suite added to
        # tests/run_suite.py after the last image publish is missing at runtime
        # (e.g. --suite nightly-xpu → "invalid choice"). Copy the checked-out
        # tests/ over the baked copy so the workflow always exercises the
        # current source-of-truth harness against the shipped wheel.
        run: |
          docker cp ./tests/. nightly_sglkernel_xpu:/root/sglang/sgl-kernel-xpu/tests/

      - name: Install run_suite extras + HF login
        timeout-minutes: 20
        run: |
          docker exec nightly_sglkernel_xpu /miniforge3/envs/py3.10/bin/python3 -m pip install --upgrade pip
          docker exec nightly_sglkernel_xpu /miniforge3/envs/py3.10/bin/python3 -m pip install pytest expecttest ray huggingface_hub scipy tabulate
          docker exec nightly_sglkernel_xpu /bin/bash -c '/miniforge3/envs/py3.10/bin/hf auth login --token ${HF_TOKEN}'
          docker exec nightly_sglkernel_xpu /bin/bash -c "ln -sf /miniforge3/envs/py3.10/bin/python3 /usr/bin/python3"

      - name: Verify pre-installed sgl-kernel wheel
        run: |
          docker exec nightly_sglkernel_xpu /miniforge3/envs/py3.10/bin/python3 -c \
            "import sgl_kernel; print('sgl_kernel loaded from', sgl_kernel.__file__)"

      - name: sgl-kernel-test (nightly kernel suite)
        timeout-minutes: 30
        run: |
          docker exec -w /root/sglang nightly_sglkernel_xpu \
            /bin/bash -c "cd /root/sglang/sgl-kernel-xpu/tests && /miniforge3/envs/py3.10/bin/python3 -m pip install scipy && \
                          python3 run_suite.py --suite sgl-kernel-test "

      - name: sgl-kernel-benchmark (nightly benchmark suite)
        timeout-minutes: 40
        run: |
          docker exec -w /root/sglang nightly_sglkernel_xpu \
            /bin/bash -c "\
              set -o pipefail && \
              /miniforge3/envs/py3.10/bin/python3 -m pip install tabulate && \
              cd /root/sglang/sgl-kernel-xpu/benchmark && \
              python3 bench_flash_attn.py 2>&1 | tee flash.log && \
              python3 bench_flash_mla_decode.py 2>&1 | tee mla.log && \
              python3 bench_flash_mla_with_kvcache.py 2>&1 | tee mla_with_kvcache.log && \
              python3 bench_moe_topk_sigmoid.py 2>&1 | tee moe_topk_sigmoid.log && \
              python3 bench_moe_topk_softmax.py 2>&1 | tee moe.log && \
              python3 bench_fused_moe.py 2>&1 | tee fused_moe.log && \
              python3 bench_moe_sum_reduce.py 2>&1 | tee moe_sum_reduce.log && \
              python3 bench_moe_fused_gate.py 2>&1 | tee moe_fused_gate.py.log && \
              python3 bench_merge_states_v2.py 2>&1 | tee merge_states.py.log && \
              python3 bench_mrope.py 2>&1 | tee mrope.py.log && \
              python3 bench_swiglu_alpha_limit.py 2>&1 | tee swiglu_alpha_limit.py.log && \
              python3 bench_fused_qk_norm_rope.py 2>&1 | tee fused_qk_norm_rope.py.log && \
              python3 bench_fused_qk_rope_with_cache.py 2>&1 | tee bench_fused_qk_rope_with_cache.py.log && \
              echo 'Skipping bench_per_token_group_quant_8bit.py (disabled to unblock other benchmarks; see PR #256)' && \
              python3 bench_per_token_group_quant_mxfp4.py 2>&1 | tee per_token_group_quant_mxfp4.py.log && \
              python3 bench_per_token_group_quant_8bit_v2.py 2>&1 | tee bench_per_token_group_quant_8bit_v2.py.log && \
              python3 bench_per_token_quant_fp8.py 2>&1 | tee bench_per_token_quant_fp8.py.log && \
              python3 bench_per_token_group_quant_mxfp4_fusion.py 2>&1 | tee bench_per_token_group_quant_mxfp4_fusion.py.log && \
              python3 bench_scatter_tokens_to_experts.py 2>&1 | tee bench_scatter_tokens_to_experts.py.log && \
              python3 bench_top_k_renorm_probs.py 2>&1 | tee bench_top_k_renorm_probs.py.log && \
              python3 bench_hc_split_sinkhorn.py 2>&1 | tee bench_hc_split_sinkhorn.py.log && \
              python3 bench_hc_pre_fuse.py 2>&1 | tee bench_hc_pre_fuse.py.log && \
              python3 bench_embedding_lora_a_fwd.py 2>&1 | tee bench_embedding_lora_a_fwd.py.log && \
              python3 bench_moe_mxfp4_w4a16_gemm.py 2>&1 | tee bench_moe_mxfp4_w4a16_gemm.py.log && \
              python3 bench_fused_experts_mxfp4.py 2>&1 | tee bench_fused_experts_mxfp4.py.log && \
              python3 bench_hc_pre_gemm_sqr_sum.py 2>&1 | tee bench_hc_pre_gemm_sqr_sum.py.log && \
              python3 bench_mhc_pre.py 2>&1 | tee bench_mhc_pre.py.log && \
              python3 bench_silu_and_mul_clamp.py 2>&1 | tee bench_silu_and_mul_clamp.log && \
              python3 bench_jit_rmsnorm.py 2>&1 | tee bench_jit_rmsnorm.py.log && \
              python3 bench_jit_qknorm.py 2>&1 | tee bench_jit_qknorm.py.log && \
              python3 bench_jit_rope.py 2>&1 | tee bench_jit_rope.py.log && \
              python3 bench_jit_timestep_embedding.py 2>&1 | tee bench_jit_timestep_embedding.py.log && \
              python3 bench_jit_per_tensor_quant_fp8.py 2>&1 | tee bench_jit_per_tensor_quant_fp8.py.log && \
              python3 bench_jit_moe_align_block_size.py 2>&1 | tee bench_jit_moe_align_block_size.py.log && \
              python3 bench_jit_per_token_group_quant_8bit_v2.py 2>&1 | tee bench_jit_per_token_group_quant_8bit_v2.py.log && \
              python3 bench_jit_activation.py 2>&1 | tee bench_jit_activation.py.log && \
              python3 bench_hc_post.py 2>&1 | tee bench_hc_post.py.log && \
              python3 bench_sgemm_lora_a_fwd.py 2>&1 | tee bench_sgemm_lora_a_fwd.py.log
            "

      - name: Nightly Test (1-GPU XPU Kernel)
        timeout-minutes: 240
        run: |
          docker exec -w /root/sglang/sgl-kernel-xpu/tests nightly_sglkernel_xpu \
            /miniforge3/envs/py3.10/bin/python3 run_suite.py \
              --suite nightly-xpu \
              --timeout-per-file 7200 \
            || TEST_EXIT_CODE=$?
          exit ${TEST_EXIT_CODE:-0}
        # continue_on_error semantics: schedule/workflow_dispatch swallow
        # failures per the input flag; workflow_call runs propagate as-is.
        continue-on-error: ${{ github.event_name == 'schedule' || inputs.continue_on_error == true }}

      # ------------------------------------------------------------------
      # Placeholder for future multi-GPU nightly suites. Add
      # nightly-xpu-2-gpu / nightly-xpu-4-gpu jobs modeled on the sglang
      # nightly-test-intel.yml pattern once the corresponding suites
      # exist in tests/run_suite.py.
      # ------------------------------------------------------------------

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f nightly_sglkernel_xpu || true

  check-all-jobs:
    if: always() && (github.repository == 'sgl-project/sgl-kernel-xpu' || github.event_name == 'workflow_dispatch')
    needs:
      - nightly-xpu-1-gpu
    runs-on: ubuntu-latest
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more nightly test jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more nightly test jobs were cancelled"
            exit 1
          fi
          echo "All nightly test jobs passed"
