name: PR Test (XPU)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-test-xpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    permissions: write-all
    runs-on: sglang-bmg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull nightly Docker image
        run: |
          docker pull intel/sgl-kernel-xpu-dev:latest

      - name: Run container
        run: |
          docker run -dt \
            --device /dev/dri/ \
            --name ci_sglkernel_xpu \
            -e HF_TOKEN=$(cat ~/huggingface_token.txt) \
            intel/sgl-kernel-xpu-dev:latest

      - name: Rebuild sgl-kernel from latest main + PR
        timeout-minutes: 40
        env:
          # refs/pull/N/merge is GitHub's pre-computed merge commit:
          # current base (main) merged with this PR. Testing that ref
          # catches conflicts with anything that landed on main while
          # the PR was in flight.
          PR_MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          docker exec -e PR_MERGE_REF="${PR_MERGE_REF}" ci_sglkernel_xpu \
            /bin/bash -c '\
              set -exo pipefail && \
              . /miniforge3/bin/activate && \
              conda activate py3.10 && \
              cd /root/sglang/sgl-kernel-xpu && \
              git remote set-url origin https://github.com/sgl-project/sgl-kernel-xpu.git && \
              git fetch --depth=1 origin "${PR_MERGE_REF}" && \
              git checkout FETCH_HEAD && \
              # Nuke the image-baked build/ tree so Ninja recompiles against
              # the freshly checked-out source. Without this, C++/SYCL PRs
              # get silently linked against the prebuilt .o files from the
              # nightly image and the wheel that ships to tests contains
              # the pre-PR kernel code.
              rm -rf build && \
              pip uninstall -y sgl-kernel || true && \
              pip install --force-reinstall -v . && \
              python -c "import sgl_kernel; print(sgl_kernel.__file__)" \
            '

      - name: Install Dependency
        timeout-minutes: 20
        run: |
          docker exec ci_sglkernel_xpu /miniforge3/envs/py3.10/bin/python3 -m pip install --upgrade pip
          docker exec ci_sglkernel_xpu /miniforge3/envs/py3.10/bin/python3 -m pip install pytest expecttest ray huggingface_hub
          docker exec ci_sglkernel_xpu /bin/bash -c '/miniforge3/envs/py3.10/bin/hf auth login --token ${HF_TOKEN} '
          docker exec ci_sglkernel_xpu /bin/bash -c "ln -sf /miniforge3/envs/py3.10/bin/python3 /usr/bin/python3"

      - name: Run Sglang Kernel Cases
        timeout-minutes: 70
        run: |
          docker exec -w /root/sglang ci_sglkernel_xpu \
            /bin/bash -c "cd /root/sglang/sgl-kernel-xpu/tests && /miniforge3/envs/py3.10/bin/python3 -m pip install scipy && \
                          python3 run_suite.py --suite per-commit "

      # Sequential commands under `set -eo pipefail` so a crashing bench
      # fails *this* step. Do not join with `&&`: a missing `&&` used to
      # let later benches run and hide the failure as a later `docker cp`.
      - name: Run Sglang Kernel Benchmarks
        timeout-minutes: 40
        run: |
          docker exec -w /root/sglang ci_sglkernel_xpu \
            /bin/bash -c "\
              set -eo pipefail
              /miniforge3/envs/py3.10/bin/python3 -m pip install tabulate
              cd /root/sglang/sgl-kernel-xpu/benchmark
              python3 bench_flash_attn.py 2>&1 | tee flash.log
              python3 bench_flash_mla_decode.py 2>&1 | tee mla.log
              python3 bench_flash_mla_prefill.py 2>&1 | tee mla_prefill.log
              python3 bench_flash_mla_with_kvcache.py 2>&1 | tee mla_with_kvcache.log
              python3 bench_flash_mla_sparse_fwd.py 2>&1 | tee mla_sparse_fwd.log
              python3 bench_moe_topk_sigmoid.py 2>&1 | tee moe_topk_sigmoid.log
              python3 bench_moe_topk_softmax.py 2>&1 | tee moe.log
              python3 bench_fused_moe.py 2>&1 | tee fused_moe.log
              python3 bench_moe_sum_reduce.py 2>&1 | tee moe_sum_reduce.log
              python3 bench_moe_fused_gate.py 2>&1 | tee moe_fused_gate.py.log
              python3 bench_merge_states_v2.py 2>&1 | tee merge_states.py.log
              python3 bench_mrope.py 2>&1 | tee mrope.py.log
              python3 bench_swiglu_alpha_limit.py 2>&1 | tee swiglu_alpha_limit.py.log
              python3 bench_fused_qk_norm_rope.py 2>&1 | tee fused_qk_norm_rope.py.log
              python3 bench_fused_qk_rope_with_cache.py 2>&1 | tee bench_fused_qk_rope_with_cache.py.log
              echo 'Skipping bench_per_token_group_quant_8bit.py (disabled to unblock other benchmarks; see PR #256)'
              python3 bench_per_token_group_quant_mxfp4.py 2>&1 | tee per_token_group_quant_mxfp4.py.log
              python3 bench_per_token_group_quant_8bit_v2.py 2>&1 | tee bench_per_token_group_quant_8bit_v2.py.log
              python3 bench_per_token_quant_fp8.py 2>&1 | tee bench_per_token_quant_fp8.py.log
              python3 bench_per_token_group_quant_mxfp4_fusion.py 2>&1 | tee bench_per_token_group_quant_mxfp4_fusion.py.log
              python3 bench_scatter_tokens_to_experts.py 2>&1 | tee bench_scatter_tokens_to_experts.py.log
              python3 bench_top_k_renorm_probs.py 2>&1 | tee bench_top_k_renorm_probs.py.log
              python3 bench_hc_split_sinkhorn.py 2>&1 | tee bench_hc_split_sinkhorn.py.log
              python3 bench_hc_pre_fuse.py 2>&1 | tee bench_hc_pre_fuse.py.log
              python3 bench_embedding_lora_a_fwd.py 2>&1 | tee bench_embedding_lora_a_fwd.py.log
              python3 bench_moe_w4a16_grouped_gemm.py 2>&1 | tee bench_moe_w4a16_grouped_gemm.py.log
              python3 bench_fused_experts_w4a16.py 2>&1 | tee bench_fused_experts_w4a16.py.log
              python3 bench_hc_pre_gemm_sqr_sum.py 2>&1 | tee bench_hc_pre_gemm_sqr_sum.py.log
              python3 bench_mhc_pre.py 2>&1 | tee bench_mhc_pre.py.log
              python3 bench_silu_and_mul_clamp.py 2>&1 | tee bench_silu_and_mul_clamp.log
              python3 bench_jit_rmsnorm.py 2>&1 | tee bench_jit_rmsnorm.py.log
              python3 bench_jit_qknorm.py 2>&1 | tee bench_jit_qknorm.py.log
              python3 bench_jit_rope.py 2>&1 | tee bench_jit_rope.py.log
              python3 bench_jit_timestep_embedding.py 2>&1 | tee bench_jit_timestep_embedding.py.log
              python3 bench_jit_per_token_group_quant_8bit.py 2>&1 | tee bench_jit_per_token_group_quant_8bit.py.log
              python3 bench_hc_post.py 2>&1 | tee bench_hc_post.py.log
              python3 bench_jit_moe_topk_sigmoid.py 2>&1 | tee bench_jit_moe_topk_sigmoid.py.log
              python3 bench_jit_moe_fused_gate.py 2>&1 | tee bench_jit_moe_fused_gate.py.log
              python3 bench_jit_per_tensor_quant_fp8.py 2>&1 | tee bench_jit_per_tensor_quant_fp8.py.log
              python3 bench_jit_moe_align_block_size.py 2>&1 | tee bench_jit_moe_align_block_size.py.log
              python3 bench_jit_per_token_group_quant_8bit_v2.py 2>&1 | tee bench_jit_per_token_group_quant_8bit_v2.py.log
              python3 bench_jit_activation.py 2>&1 | tee bench_jit_activation.py.log
              python3 bench_hc_post.py 2>&1 | tee bench_hc_post.py.log
              python3 bench_sgemm_lora_a_fwd.py 2>&1 | tee bench_sgemm_lora_a_fwd.py.log
              python3 bench_biased_topk.py 2>&1 | tee bench_biased_topk.py.log
              python3 bench_sgemm_lora_b_fwd.py 2>&1 | tee bench_sgemm_lora_b_fwd.py.log
              python3 bench_min_p_sampling_from_probs.py 2>&1 | tee bench_min_p_sampling_from_probs.py.log
              python3 bench_top_p_renorm_probs.py 2>&1 | tee bench_top_p_renorm_probs.py.log
              python3 bench_top_k_top_p_sampling_from_probs.py 2>&1 | tee bench_top_k_top_p_sampling_from_probs.py.log
            "

      - name: Copy logs from container
        timeout-minutes: 20
        run: |
          docker cp ci_sglkernel_xpu:/root/sglang/sgl-kernel-xpu/benchmark/fused_moe.log ./fused_moe.log
          docker cp ci_sglkernel_xpu:/root/sglang/sgl-kernel-xpu/benchmark/flash.log ./flash.log
          python3 benchmark/update_baseline_from_log.py

      - name: Install GitHub CLI
        # Only run on same-repo PRs. Fork PRs get read-only creds by GitHub design,
        # so pushing / opening the auto baseline PR is impossible from here.
        if: >
          contains(join(github.event.pull_request.labels.*.name, ','), 'perf') &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          sudo apt update
          sudo apt install -y gh

      - name: Auto PR for baseline.json update
        # Same-repo perf PRs only: secrets.PAT is unavailable for fork PRs
        # (GitHub withholds secrets from pull_request runs originating on forks),
        # which is exactly what caused the 403 on PR #342. For fork PRs, the
        # step below uploads baseline.json as an artifact for maintainers.
        if: >
          success() &&
          contains(join(github.event.pull_request.labels.*.name, ','), 'perf') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('ci_has_lower.txt') != ''
        run: |
          SRC_PR=${{ github.event.pull_request.number }}
          BRANCH="ci/update-baseline-pr-${SRC_PR}"
          BASE="main"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$(cat ci_has_lower.txt)" = "0" ]; then
            echo "No LOWER entries, skipping PR."
            exit 0
          fi

          TMP_BASELINE=$(mktemp)
          cp benchmark/baseline.json "$TMP_BASELINE"

          TMP_BODY=$(mktemp)
          cp ci_pr_body.md "$TMP_BODY"

          git reset --hard
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH; then
            git checkout "$BRANCH"
          else
            git checkout -B "$BRANCH" "origin/$BASE"
          fi

          cp "$TMP_BASELINE" benchmark/baseline.json
          cp "$TMP_BODY" ci_pr_body.md
          git add benchmark/baseline.json
          if command -v pre-commit >/dev/null 2>&1; then
              pre-commit run --files benchmark/baseline.json || true
              git add benchmark/baseline.json
          fi
          git commit -m "CI intermediate baseline update" || echo "No changes to commit"
          echo "Detected changes in baseline.json: $(git diff --cached --stat)"

          git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/sgl-project/sgl-kernel-xpu.git
          git push -f origin "$BRANCH"
          export GITHUB_TOKEN="${{ secrets.PAT }}"

          PR_NUMBER=$(gh pr list \
            --repo sgl-project/sgl-kernel-xpu \
            --head "$BRANCH" \
            --base "$BASE" \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --repo sgl-project/sgl-kernel-xpu \
              --title "CI: Update baseline.json (from PR #${SRC_PR}) " \
              --body-file ci_pr_body.md \
              --base "$BASE" \
              --head "$BRANCH"
            )

            echo "PR created at $PR_URL"
          else
            echo "Baseline PR #$PR_NUMBER already exists for source PR #${SRC_PR}, updated with new commit."
            gh pr comment "$PR_NUMBER" \
              --repo sgl-project/sgl-kernel-xpu \
              --body-file ci_pr_body.md
          fi

      - name: Notify maintainers (fork PR baseline update needed)
        # Fork PRs cannot push directly. Surface a warning in the run summary
        # so the maintainer knows to grab the artifact below.
        if: >
          success() &&
          contains(join(github.event.pull_request.labels.*.name, ','), 'perf') &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          hashFiles('ci_has_lower.txt') != ''
        run: |
          echo "::warning::PR #${{ github.event.pull_request.number }} is from a fork (${{ github.event.pull_request.head.repo.full_name }}). GitHub does not expose secrets to fork PRs, so the auto baseline PR cannot be pushed. Download the 'baseline-update-pr-${{ github.event.pull_request.number }}' artifact below and commit benchmark/baseline.json manually from an internal branch."

      - name: Upload baseline update artifact (fork PRs)
        if: >
          success() &&
          contains(join(github.event.pull_request.labels.*.name, ','), 'perf') &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          hashFiles('ci_has_lower.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: baseline-update-pr-${{ github.event.pull_request.number }}
          path: |
            benchmark/baseline.json
            ci_pr_body.md
          if-no-files-found: warn
          retention-days: 14

      - name: Run E2E Bfloat16 tests
        timeout-minutes: 20
        run: |
          echo "[PlaceHolder for E2E Test...]"

      - name: Run E2E Qunatization tests
        timeout-minutes: 20
        run: |
          echo "[PlaceHolder for E2E Test...]"

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f ci_sglkernel_xpu || true
