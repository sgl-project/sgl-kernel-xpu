name: sgl-kernel Nightly (XPU)

# Fully independent of pr-test-xpu.yml. Runs the nightly-only kernel
# and benchmark suites defined in tests/run_nightly_suite.py against the
# published intel/sgl-kernel-xpu-dev:latest wheel (built by
# release-docker-xpu-kernel-nightly.yml).

on:
  schedule:
    # A few hours after the nightly image publish (12:00 UTC).
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to checkout"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: true

concurrency:
  group: sgl-kernel-nightly-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || inputs.ref && format('caller-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !inputs.ref && github.event_name != 'workflow_call' && github.event_name != 'workflow_dispatch' }}

jobs:
  sgl-kernel-nightly:
    if: github.repository == 'sgl-project/sgl-kernel-xpu'
    runs-on: sglang-bmg
    env:
      DOCKERHUB_INTEL_USERNAME: ${{ secrets.DOCKERHUB_INTEL_USERNAME }}
      DOCKERHUB_INTEL_TOKEN: ${{ secrets.DOCKERHUB_INTEL_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Pull nightly Docker image
        run: |
          docker pull intel/sgl-kernel-xpu-dev:latest

      - name: Run container
        run: |
          docker run -dt \
            --device /dev/dri/ \
            --name sgl_kernel_nightly \
            -e HF_TOKEN=$(cat ~/huggingface_token.txt) \
            intel/sgl-kernel-xpu-dev:latest

      - name: Sync tests/ and benchmark/ from checkout into container
        # The nightly image bakes tests/ and benchmark/ at build time, so any
        # new suite entries or bench scripts added after the last image publish
        # are missing at runtime. Overlay the checked-out copies so the workflow
        # always exercises the current source-of-truth harness against the
        # shipped wheel.
        run: |
          docker cp ./tests/. sgl_kernel_nightly:/root/sglang/sgl-kernel-xpu/tests/
          docker cp ./benchmark/. sgl_kernel_nightly:/root/sglang/sgl-kernel-xpu/benchmark/

      - name: Install runner extras + HF login
        timeout-minutes: 20
        run: |
          docker exec sgl_kernel_nightly /miniforge3/envs/py3.12/bin/python3 -m pip install --upgrade pip
          docker exec sgl_kernel_nightly /miniforge3/envs/py3.12/bin/python3 -m pip install pytest expecttest ray huggingface_hub scipy tabulate
          docker exec sgl_kernel_nightly /bin/bash -c '/miniforge3/envs/py3.12/bin/hf auth login --token ${HF_TOKEN}'
          docker exec sgl_kernel_nightly /bin/bash -c "ln -sf /miniforge3/envs/py3.12/bin/python3 /usr/bin/python3"

      - name: Verify pre-installed sgl-kernel wheel
        run: |
          docker exec sgl_kernel_nightly /miniforge3/envs/py3.12/bin/python3 -c \
            "import sgl_kernel; print('sgl_kernel loaded from', sgl_kernel.__file__)"

      - name: sgl-kernel-test (nightly kernel suite)
        timeout-minutes: 240
        run: |
          docker exec -w /root/sglang/sgl-kernel-xpu/tests sgl_kernel_nightly \
            /miniforge3/envs/py3.12/bin/python3 run_nightly_suite.py \
              --suite sgl-kernel-test \
              --timeout-per-file 7200 \
            || TEST_EXIT_CODE=$?
          exit ${TEST_EXIT_CODE:-0}
        continue-on-error: ${{ github.event_name == 'schedule' || inputs.continue_on_error == true }}

      - name: sgl-kernel-benchmark (nightly benchmark suite)
        timeout-minutes: 60
        run: |
          docker exec -w /root/sglang/sgl-kernel-xpu/tests sgl_kernel_nightly \
            /miniforge3/envs/py3.12/bin/python3 run_nightly_suite.py \
              --suite sgl-kernel-benchmark \
              --timeout-per-file 1800 \
            || BENCH_EXIT_CODE=$?
          exit ${BENCH_EXIT_CODE:-0}
        continue-on-error: ${{ github.event_name == 'schedule' || inputs.continue_on_error == true }}

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f sgl_kernel_nightly || true

  check-all-jobs:
    if: always() && (github.repository == 'sgl-project/sgl-kernel-xpu' || github.event_name == 'workflow_dispatch')
    needs:
      - sgl-kernel-nightly
    runs-on: ubuntu-latest
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more nightly jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more nightly jobs were cancelled"
            exit 1
          fi
          echo "All nightly jobs passed"
