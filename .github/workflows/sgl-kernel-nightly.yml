name: sgl-kernel Nightly (XPU)

# Runs the same per-commit suites as pr-test-xpu.yml (tests/run_suite.py and
# benchmark/run_suite.py, --suite per-commit) against the published AOT
# (intel/sgl-kernel-xpu-dev:latest) and JIT (:latest-jit, USE_SYCL_JIT=ON)
# wheels built by release-docker-xpu-kernel-nightly.yml. Every suite runs to
# completion; the job fails if any test or benchmark failed.

on:
  schedule:
    # A few hours after the nightly image publish (12:00 UTC).
    - cron: '0 16 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to checkout"
        required: false
        type: string
        default: ""

concurrency:
  group: sgl-kernel-nightly-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || inputs.ref && format('caller-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !inputs.ref && github.event_name != 'workflow_call' && github.event_name != 'workflow_dispatch' }}

jobs:
  sgl-kernel-nightly:
    if: github.repository == 'sgl-project/sgl-kernel-xpu'
    runs-on: sglang-bmg
    strategy:
      # Same suites for both wheels; one variant failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - variant: aot
            image: intel/sgl-kernel-xpu-dev:latest
          - variant: jit
            image: intel/sgl-kernel-xpu-dev:latest-jit
    name: sgl-kernel-nightly (${{ matrix.variant }})
    env:
      DOCKERHUB_INTEL_USERNAME: ${{ secrets.DOCKERHUB_INTEL_USERNAME }}
      DOCKERHUB_INTEL_TOKEN: ${{ secrets.DOCKERHUB_INTEL_TOKEN }}
      IMAGE: ${{ matrix.image }}
      CONTAINER: sgl_kernel_nightly_${{ matrix.variant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Pull nightly Docker image
        run: |
          docker pull "${IMAGE}"

      - name: Run container
        run: |
          docker run -dt \
            --device /dev/dri/ \
            --name "${CONTAINER}" \
            -e HF_TOKEN=$(cat ~/huggingface_token.txt) \
            "${IMAGE}"

      - name: Sync tests/ and benchmark/ from checkout into container
        # The nightly image bakes tests/ and benchmark/ at build time, so any
        # new suite entries or bench scripts added after the last image publish
        # are missing at runtime. Overlay the checked-out copies so the workflow
        # always exercises the current source-of-truth harness against the
        # shipped wheel.
        run: |
          docker cp ./tests/. "${CONTAINER}":/root/sglang/sgl-kernel-xpu/tests/
          docker cp ./benchmark/. "${CONTAINER}":/root/sglang/sgl-kernel-xpu/benchmark/

      - name: Install runner extras
        timeout-minutes: 20
        run: |
          # huggingface_hub reads HF_TOKEN from the env; `hf auth login` hits a rate-limited whoami call.
          docker exec "${CONTAINER}" /miniforge3/envs/py3.12/bin/python3 -m pip install --upgrade pip
          docker exec "${CONTAINER}" /miniforge3/envs/py3.12/bin/python3 -m pip install pytest expecttest ray huggingface_hub tabulate
          docker exec "${CONTAINER}" /bin/bash -c "ln -sf /miniforge3/envs/py3.12/bin/python3 /usr/bin/python3"

      - name: Verify pre-installed sgl-kernel wheel
        run: |
          docker exec "${CONTAINER}" /miniforge3/envs/py3.12/bin/python3 -c \
            "import sgl_kernel; print('sgl_kernel loaded from', sgl_kernel.__file__)"

      - name: Verify JIT wheel and icpx
        # sgl_src/ is only packaged by USE_SYCL_JIT=ON; JIT kernels compile with icpx on first use.
        if: matrix.variant == 'jit'
        run: |
          docker exec "${CONTAINER}" icpx --version
          docker exec "${CONTAINER}" /miniforge3/envs/py3.12/bin/python3 -c \
            "import os, sgl_kernel; d = os.path.join(os.path.dirname(sgl_kernel.__file__), 'include', 'sgl_src'); assert os.path.isdir(d), 'not a JIT wheel, missing ' + d; print('JIT wheel OK:', d)"

      # Suites keep going past failures (continue-on-error); the last step turns the job red.
      - name: Kernel tests (per-commit suite)
        id: tests
        timeout-minutes: 240
        continue-on-error: true
        run: |
          docker exec -w /root/sglang/sgl-kernel-xpu/tests "${CONTAINER}" \
            /miniforge3/envs/py3.12/bin/python3 run_suite.py \
              --suite per-commit \
              --timeout-per-file 7200 \
              --continue-on-error

      - name: Kernel benchmarks (per-commit suite)
        id: bench
        timeout-minutes: 60
        continue-on-error: true
        run: |
          docker exec -w /root/sglang/sgl-kernel-xpu/benchmark "${CONTAINER}" \
            /miniforge3/envs/py3.12/bin/python3 run_suite.py \
              --suite per-commit \
              --timeout-per-file 1800

      - name: Fail if any suite failed
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          BENCH: ${{ steps.bench.outcome }}
        run: |
          {
            echo "### sgl-kernel nightly (${{ matrix.variant }})"
            echo "| suite | outcome |"
            echo "|---|---|"
            echo "| tests (per-commit) | ${TESTS} |"
            echo "| benchmarks (per-commit) | ${BENCH} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${TESTS}" != "success" ] || [ "${BENCH}" != "success" ]; then
            echo "::error::Nightly ${{ matrix.variant }}: tests=${TESTS} benchmarks=${BENCH}"
            exit 1
          fi

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f "${CONTAINER}" || true

  check-all-jobs:
    if: always() && (github.repository == 'sgl-project/sgl-kernel-xpu' || github.event_name == 'workflow_dispatch')
    needs:
      - sgl-kernel-nightly
    runs-on: ubuntu-latest
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more nightly jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more nightly jobs were cancelled"
            exit 1
          fi
          echo "All nightly jobs passed"
