name: Wheel Test (XPU)

# Run the per-commit kernel tests + benchmarks of a given ref against a prebuilt
# wheel, in a fresh conda env of the requested Python. Nothing is built from source.

on:
  workflow_dispatch:
    inputs:
      wheel:
        description: 'Wheel URL (http/https) or absolute path on the runner'
        required: true
        type: string
      ref:
        description: 'Branch/tag/SHA whose tests/ and benchmark/ are used (e.g. release/v0.2.0)'
        required: true
        type: string
        default: 'release/v0.2.0'
      python_version:
        description: 'Python version for the test env'
        required: true
        type: choice
        options: ['3.10', '3.11', '3.12']
        default: '3.10'
      torch_version:
        description: 'torch version the wheel was built against'
        required: true
        type: string
        default: '2.13.0'
      image:
        description: 'Base image (provides driver, oneAPI, conda)'
        required: false
        type: string
        default: 'intel/sgl-kernel-xpu-dev:latest'
      run_tests:
        type: boolean
        default: true
      run_benchmarks:
        type: boolean
        default: true

concurrency:
  group: whl-test-xpu-${{ github.run_id }}
  cancel-in-progress: false

env:
  CONTAINER: whl_test_xpu_${{ github.run_id }}
  PY_ENV: whl-py${{ inputs.python_version }}
  KERNEL_DIR: /root/sglang/sgl-kernel-xpu

jobs:
  whl-test:
    runs-on: sglang-bmg
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Fetch wheel
        env:
          WHEEL: ${{ inputs.wheel }}
        run: |
          set -euo pipefail
          mkdir -p whl
          FNAME=$(basename "${WHEEL%%\?*}")
          case "$FNAME" in *.whl) ;; *) echo "::error::Not a .whl: $WHEEL"; exit 1 ;; esac
          case "$WHEEL" in
            http://*|https://*) curl -fSL --retry 5 --retry-delay 10 -o "whl/$FNAME" "$WHEEL" ;;
            *) cp "$WHEEL" "whl/$FNAME" ;;
          esac
          python3 -c "import zipfile; zipfile.ZipFile('whl/$FNAME').testzip() or print('wheel OK')"
          echo "WHEEL_FILE=$FNAME" >> "$GITHUB_ENV"

      - name: Start container
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker pull "$IMAGE"
          docker run -dt --device /dev/dri/ --name "$CONTAINER" \
            -e HF_TOKEN="$(cat ~/huggingface_token.txt)" "$IMAGE"

      - name: Remove image-baked sgl-kernel
        # The image ships a kernel built from main; drop it so only the given wheel is testable.
        run: |
          docker exec "$CONTAINER" /bin/bash -c '
            set -ex
            /miniforge3/envs/py3.12/bin/python3 -m pip uninstall -y sglang-kernel-xpu sgl-kernel || true
            rm -rf /root/sglang/sgl-kernel-xpu
            mkdir -p /root/sglang/sgl-kernel-xpu
          '

      - name: Copy tests/ and benchmark/ from ${{ inputs.ref }}
        run: |
          docker cp ./tests "$CONTAINER:$KERNEL_DIR/tests"
          docker cp ./benchmark "$CONTAINER:$KERNEL_DIR/benchmark"
          docker cp ./whl "$CONTAINER:/tmp/whl"

      - name: Create Python ${{ inputs.python_version }} env and install wheel
        timeout-minutes: 30
        env:
          PY: ${{ inputs.python_version }}
          TORCH: ${{ inputs.torch_version }}
        run: |
          docker exec -e PY -e TORCH -e PY_ENV -e WHEEL_FILE "$CONTAINER" /bin/bash -c '
            set -exo pipefail
            . /miniforge3/bin/activate
            conda create -y -n "$PY_ENV" python="$PY"
            conda activate "$PY_ENV"
            pip install --upgrade pip
            pip install --timeout 300 --retries 10 "torch==$TORCH" torchvision triton-xpu \
              --index-url https://download.pytorch.org/whl/xpu
            pip install --no-deps --force-reinstall "/tmp/whl/$WHEEL_FILE"
            pip install pytest expecttest ray huggingface_hub scipy tabulate pandas matplotlib
            hf auth login --token "$HF_TOKEN"
            # tests/test_utils.py spawns bare "python3".
            ln -sf "/miniforge3/envs/$PY_ENV/bin/python3" /usr/bin/python3
            pip show sglang-kernel-xpu
          '

      - name: Verify sgl_kernel comes from the given wheel
        run: |
          docker exec -i -w /root/sglang/sgl-kernel-xpu/tests -e PY_ENV -e WHEEL_FILE "$CONTAINER" \
            "/miniforge3/envs/$PY_ENV/bin/python3" - <<'EOF' | tee kernel_info.txt
          import os, sys, importlib.metadata as md
          import torch, sgl_kernel
          env_prefix = f"/miniforge3/envs/{os.environ['PY_ENV']}/"
          whl_ver = os.environ["WHEEL_FILE"].split("-")[1]
          dist_ver = md.version("sglang-kernel-xpu")
          print("python     :", sys.version.split()[0])
          print("torch      :", torch.__version__, "xpu:", torch.xpu.is_available())
          print("sgl_kernel :", sgl_kernel.__file__)
          print("wheel/dist :", whl_ver, "/", dist_ver)
          assert sgl_kernel.__file__.startswith(env_prefix), "sgl_kernel not loaded from test env"
          assert dist_ver == whl_ver, "installed version does not match wheel"
          assert torch.xpu.is_available(), "XPU not visible"
          EOF

      - name: Write per-file runner
        # The suite runners stop at the first failing file; run one entry at a
        # time so every file gets a status and duration.
        run: |
          cat > "$RUNNER_TEMP/run_per_file.sh" <<'EOF'
          #!/usr/bin/env bash
          # Usage: run_per_file.sh <tests|benchmark> <suite label>
          set -uo pipefail
          dir=$1; label=$2
          mapfile -t names < <(docker exec -w "$KERNEL_DIR/$dir" "$CONTAINER" \
            "/miniforge3/envs/$PY_ENV/bin/python3" -c \
            'import run_suite as r; print("\n".join(f.name for f in r.suites["per-commit"]))')
          if [ ${#names[@]} -eq 0 ]; then echo "::error::no $label files found"; exit 1; fi
          failed=0
          for i in "${!names[@]}"; do
            start=$(date +%s)
            if docker exec -w "$KERNEL_DIR/$dir" "$CONTAINER" /bin/bash -c \
                ". /miniforge3/bin/activate $PY_ENV && python3 run_suite.py --suite per-commit --range-begin $i --range-end $((i + 1))" </dev/null; then
              status=pass
            else
              status=fail; failed=$((failed + 1))
            fi
            echo "${names[$i]},$label,$status,$(( $(date +%s) - start ))" >> "$GITHUB_WORKSPACE/results.csv"
          done
          echo "$label: $failed of ${#names[@]} file(s) failed"
          [ "$failed" -eq 0 ]
          EOF
          chmod +x "$RUNNER_TEMP/run_per_file.sh"

      - name: Kernel tests (per-commit suite)
        if: inputs.run_tests
        timeout-minutes: 120
        run: $RUNNER_TEMP/run_per_file.sh tests test

      - name: Kernel benchmarks (per-commit suite)
        if: ${{ inputs.run_benchmarks && !cancelled() }}
        timeout-minutes: 90
        run: $RUNNER_TEMP/run_per_file.sh benchmark benchmark

      - name: Compare against ${{ inputs.ref }} baseline.json
        if: ${{ inputs.run_benchmarks && !cancelled() }}
        run: |
          mkdir -p bench_logs
          docker cp "$CONTAINER:$KERNEL_DIR/benchmark/." bench_logs/ || true
          cp bench_logs/fused_moe.log bench_logs/flash.log . 2>/dev/null || true
          python3 benchmark/update_baseline_from_log.py || true

      - name: Summary
        if: always()
        env:
          WHEEL: ${{ inputs.wheel }}
          REF: ${{ inputs.ref }}
          PY: ${{ inputs.python_version }}
          TORCH: ${{ inputs.torch_version }}
        run: |
          export SHA=$(git rev-parse --short HEAD)
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          env = os.environ
          rows = list(csv.reader(open("results.csv"))) if os.path.exists("results.csv") else []
          with open(f"results_py{env['PY']}.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["File Name", "Suite", "Status", "Duration(Sec.)"])
              w.writerows(rows)

          print(f"### Wheel test: Python {env['PY']}\n")
          print(f"- Wheel: `{env['WHEEL']}`")
          print(f"- Ref: `{env['REF']}` ({env['SHA']})")
          print(f"- torch: {env['TORCH']}\n")
          if os.path.exists("kernel_info.txt"):
              print("```\n" + open("kernel_info.txt").read().strip() + "\n```\n")

          print("| Suite | Total | Pass | Fail | Duration(Sec.) |")
          print("|---|---:|---:|---:|---:|")
          for suite in ("test", "benchmark"):
              sel = [r for r in rows if r[1] == suite]
              npass = sum(r[2] == "pass" for r in sel)
              total_s = sum(int(r[3]) for r in sel)
              print(f"| {suite} | {len(sel)} | {npass} | {len(sel) - npass} | {total_s} |")
          print()

          if os.path.exists("ci_pr_body.md"):
              print("<details><summary>Benchmark vs baseline.json (flash_attn, fused_moe)</summary>\n")
              print(open("ci_pr_body.md").read())
              print("\n</details>\n")

          print("| File Name | Suite | Status | Duration(Sec.) |")
          print("|---|---|---|---:|")
          for name, suite, status, dur in rows:
              shown = status if status == "pass" else f"**{status.upper()}**"
              print(f"| {name} | {suite} | {shown} | {dur} |")
          EOF

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whl-test-py${{ inputs.python_version }}-${{ github.run_id }}
          path: |
            results_py*.csv
            kernel_info.txt
            bench_logs/*.log
            ci_pr_body.md
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup container
        if: always()
        run: docker rm -f "$CONTAINER" || true
