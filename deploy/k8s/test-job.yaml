apiVersion: batch/v1
kind: Job
metadata:
  name: sgl-gptq-xpu-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeName: hal
      containers:
        - name: gptq
          image: ${IMAGE}:${TAG}
          imagePullPolicy: Always
          env:
            - name: MODE
              value: "${MODE}"
            - name: STAGE
              value: "${STAGE}"
            - name: BASELINE_TPS
              value: "${BASELINE_TPS}"
            - name: SGL_GPTQ_PROFILE
              value: "${SGL_GPTQ_PROFILE}"
            - name: MAX_NEW_TOKENS
              value: "${MAX_NEW_TOKENS}"
            - name: SGL_GPTQ_STEP
              value: "${SGL_GPTQ_STEP}"
            - name: SGL_GPTQ_PAGE_SIZE
              value: "${SGL_GPTQ_PAGE_SIZE}"
            - name: SGL_GPTQ_CONTEXT_LENGTH
              value: "${SGL_GPTQ_CONTEXT_LENGTH}"
            - name: SGL_GPTQ_SPEC
              value: "${SGL_GPTQ_SPEC}"
            - name: SGL_GPTQ_SPEC_STEPS
              value: "${SGL_GPTQ_SPEC_STEPS}"
            - name: SGL_GPTQ_SPEC_DRAFT_TOKENS
              value: "${SGL_GPTQ_SPEC_DRAFT_TOKENS}"
            - name: SGL_GPTQ_MAMBA_CACHE
              value: "${SGL_GPTQ_MAMBA_CACHE}"
            - name: SGL_GPTQ_PP
              value: "${SGL_GPTQ_PP}"
            - name: SGL_GPTQ_TG
              value: "${SGL_GPTQ_TG}"
            - name: SGL_GPTQ_BATCH
              value: "${SGL_GPTQ_BATCH}"
            - name: SGL_GPTQ_GRAPH_BS
              value: "${SGL_GPTQ_GRAPH_BS}"
            - name: SGL_GPTQ_BATCH_WIDTHS
              value: "${SGL_GPTQ_BATCH_WIDTHS}"
            - name: SGL_GPTQ_MAX_RUNNING
              value: "${SGL_GPTQ_MAX_RUNNING}"
            - name: SGL_GPTQ_MEM_FRACTION
              value: "${SGL_GPTQ_MEM_FRACTION}"
            - name: MODEL_DIR
              value: "/tank/nas/models/Qwen3.8-27B-TURBO-DF735-882-NM-DAU-GPTQ-Int4-g128-tuned"
          resources:
            requests:
              gpu.intel.com/xe: 1
            limits:
              gpu.intel.com/xe: 1
          volumeMounts:
            - name: models
              mountPath: /tank/nas/models
      volumes:
        - name: models
          hostPath:
            path: /tank/nas/models
            type: Directory
